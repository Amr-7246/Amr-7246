name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment: 
      name: protection
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.TOKEN_METRICS }}

          # --- Core User & Base ---
          user: amr-7246
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Africa/Cairo

          # --- Summary, Achievements, Profile KPIs ---
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C

          # --- Languages Analysis ---
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_recent_load: 500
          plugin_languages_recent_days: 30
          plugin_languages_sections: most-used
          plugin_languages_aliases: yes
          plugin_languages_details: bytes-size, percentage

          # --- Activity Graph ---
          plugin_activity: yes
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_activity_visibility: all

          # --- Coding Habits ---
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30

          # --- Lines of Code Trend ---
          plugin_lines: yes
          plugin_lines_sections: repositories
          plugin_lines_repositories_limit: 20

          # --- Topics / Interests Heatmap ---
          plugin_topics: yes
          plugin_topics_limit: 15
          plugin_topics_mode: icons

          # --- Follow-up Metrics ---
          plugin_followup: yes
          plugin_followup_sections: repositories, people

          # --- Contributors & People Graph ---
          plugin_people: yes
          plugin_people_types: followers, following

          # --- Traffic Dashboard ---
          plugin_traffic: yes

          # --- Calendar / Heatmap ---
          plugin_calendar: yes
          plugin_calendar_limit: 1

          # --- Stargazers Analytics ---
          plugin_stargazers: yes
          plugin_stargazers_charts: yes
          plugin_stargazers_charts_type: graph

          # --- Sponsors Section ---
          plugin_sponsors: yes
          plugin_sponsors_sections: goal, list

          # --- Repository Overview ---
          plugin_repositories: yes
          plugin_repositories_order: featured, pinned, starred, random
          plugin_repositories_featured: amr-7246
